<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© {{ site.time | date: '%Y' }} {{ site.author.name }}. {{ site.tagline }}</p>
    <p>
      <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      {% if site.author.email != "" %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
    </p>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
