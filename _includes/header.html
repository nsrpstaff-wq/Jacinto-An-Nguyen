<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{% if site.logo %}<img class="brand-logo" src="{{ site.logo | relative_url }}" alt="" width="48" height="48">{% endif %}<span>{{ site.title }}</span></a>
    <nav class="nav" aria-label="Main">
      {% for s in site.sections %}
        <a href="{{ s.url | relative_url }}"{% if page.url == s.url %} aria-current="page"{% endif %}>{{ s.title }}</a>
      {% endfor %}
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <button class="theme-toggle" type="button" aria-label="Switch light or dark mode" title="Light / dark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </nav>
  </div>
</header>
