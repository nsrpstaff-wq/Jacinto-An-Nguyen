# ---------------------------------------------------------------
#  Site settings — edit these to make the site yours.
#  (After changing this file, GitHub rebuilds the site in ~1 minute.)
# ---------------------------------------------------------------
title: Notes Along the Way
tagline: Papers, reflections, and things I am learning.
hero_line: Papers, lessons, and reflections.   # gold italic line under the title on the home page
# hero_image: /assets/images/your-photo.jpg   # optional: a wide photo behind the home page title
description: >-
  A place to publish academic papers, share experiences, and keep
  notes on what I am learning.
author:
  name: Jacinto An Nguyen
  bio: >-
    Graduate student writing on theology, history, and the life of the mind.
  email: ""                       # optional; leave empty to hide

# If your repository is named <username>.github.io, leave baseurl empty.
# If it has another name (e.g. "notes"), set baseurl: "/notes".
url: "https://nsrpstaff-wq.github.io"
baseurl: "/Jacinto-An-Nguyen"

# The sections of the site (one per menu item). "key" must match the
# `category:` you write at the top of each post.
sections:
  - key: papers
    title: Papers
    url: /papers/
    blurb: Longer academic work — essays, research papers, and presentations.
  - key: reflections
    title: Reflections
    url: /reflections/
    blurb: Personal essays on experience, practice, and what I have seen along the way.
  - key: learning
    title: Teaching English and Skills
    url: /learning/
    blurb: Lessons, resources, and notes on teaching English and practical skills.
  - key: reviews
    title: Book Reviews
    url: /reviews/
    blurb: Reviews of books I have read — what they argue, and what stayed with me.

# ---------------------------------------------------------------
#  Technical settings — you normally do not need to touch these.
# ---------------------------------------------------------------
permalink: /:year/:month/:title/
future: true                       # show posts dated later than today (e.g. an upcoming class)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
markdown: kramdown
kramdown:
  input: GFM
  footnote_backlink: "↩"
  auto_ids: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: feed.xml
exclude:
  - README.md
  - HOW-TO-WRITE.md
  - Gemfile
  - Gemfile.lock
  - vendor
